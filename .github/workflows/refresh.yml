name: Monthly refresh

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the table
        run: |
          python3 tools/build-clingen.py
          python3 tools/fetch-monarch.py
          python3 tools/build-subtypes.py
          python3 tools/fetch-clingen-phenotypes.py --refresh
          python3 tools/fetch-links.py --refresh
          python3 tools/merge.py
          python3 tools/fetch-aliases.py
          python3 tools/build-page-table.py
      - name: Report ClinGen changes for the additional genes
        # The additional-genes list is checked by hand, so this only reports.
        # One open issue collects the reports; later months add comments.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/clingen-drift.md"
          python3 tools/check-candidate-drift.py --refresh --report "$report"
          if [ -s "$report" ]; then
            title="ClinGen changes for the additional genes"
            n=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
            if [ -n "$n" ]; then
              gh issue comment "$n" --body-file "$report"
            else
              gh issue create --title "$title" --body-file "$report"
            fi
          fi
      - name: Open a pull request if the data changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh/monthly
          title: "Monthly data refresh"
          commit-message: "Monthly refresh from ClinGen, Mondo, GeneReviews and PanelApp"
          body: "Automated rebuild. Review every changed row against its source before merging, and add a dated entry to CHANGELOG.md."
